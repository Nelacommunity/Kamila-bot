<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <title>Sign in · Kamila OTP</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="card login-card">
      <h1 class="logo login-logo">Kamila</h1>
      <p class="login-tag">WhatsApp OTP gateway</p>
      <p class="login-copy">Send and verify one-time codes over WhatsApp from your own apps.</p>
      <div class="login-actions">
        <button class="btn btn-primary login-btn" id="btn-signin" disabled>Sign in</button>
        <button class="btn login-btn" id="btn-signup" disabled>Create an account</button>
      </div>
      <p class="login-msg" id="login-msg" role="status"></p>
      <p class="login-foot">Secured by Tausi Auth</p>
    </div>
  </main>
  <script type="module">
    import { getTausi, safeNext } from '/auth-client.js';

    const msg = document.getElementById('login-msg');
    const params = new URLSearchParams(location.search);
    const next = safeNext(params.get('next') || sessionStorage.getItem('kamila_next') || '/dashboard.html');

    function show(text, isError) {
      msg.textContent = text;
      msg.classList.toggle('login-error', !!isError);
    }

    try {
      const tausi = await getTausi();

      // Returning from the hosted Tausi page (?tausi_code=… or ?tausi_error=…)
      try {
        const result = await tausi.handleOAuthCallback();
        if (result) {
          sessionStorage.removeItem('kamila_next');
          location.replace(next);
        }
      } catch (err) {
        show(err.message || 'Sign-in failed', true);
      }

      await tausi.initialize();
      if (tausi.getState().status === 'signedIn') {
        location.replace(next);
      } else {
        const go = (mode) => async () => {
          sessionStorage.setItem('kamila_next', next);
          show('Redirecting…');
          try {
            await tausi.redirectToHostedPage({ redirectTo: location.origin + '/login.html', mode });
          } catch (err) {
            show(err.message || 'Could not start sign-in', true);
          }
        };
        const signin = document.getElementById('btn-signin');
        const signup = document.getElementById('btn-signup');
        signin.onclick = go('sign-in');
        signup.onclick = go('sign-up');
        signin.disabled = signup.disabled = false;
      }
    } catch (err) {
      show('Sign-in service unavailable: ' + err.message, true);
    }
  </script>
</body>
</html>
